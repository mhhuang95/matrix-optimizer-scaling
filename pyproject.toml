[project]
name = "optbench"
version = "0.1.0"
description = "Fairly-tuned scaling study of Muon / Shampoo / SOAP / AdamW with spectral diagnostics"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Intel Macs: PyTorch stopped shipping x86_64 macOS wheels after 2.2.2 (needs numpy<2).
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Lambda (Linux + CUDA): PyPI wheels ship with CUDA.
    "torch>=2.6; sys_platform == 'linux'",
    "numpy; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# Use uv-managed CPython, never a stray system/beta interpreter.
python-preference = "only-managed"
# Only resolve for the two platforms we actually use.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux'",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
